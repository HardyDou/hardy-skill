# WeChat Article Skill Configuration
# 复制到 ~/.writer/config.yaml 填入真实凭据

# WeChat API credentials
wechat:
  appid: "wx_your_appid"
  secret: "your_secret"
  author: "你的作者名"

# Default theme settings
theme: "simple"             # simple | center | decoration | prominent
theme_color: "#3498db"      # Any HEX color or preset name

# Image generation (for cover & article images)
# 支持多个 provider，配置了 api_key 的才会启用
image:
  default_provider: "gemini"  # gemini | openai | doubao | anthropic (留空自动选择有 key 的)
  providers:
    gemini:                  # Google Gemini Imagen
      api_key: ""            # Google AI Studio API key
      model: "imagen-4.0-ultra-generate-001"
    openai:                  # GPT Image
      api_key: ""            # OpenAI API key
      model: "gpt-image-1"
    doubao:                  # 豆包 Seedream 5.0
      api_key: ""            # 火山引擎 API key
      model: "doubao-seedream-5-0-260128"
      base_url: "https://ark.cn-beijing.volces.com/api/v3"
    anthropic:              # Claude Image Gen
      api_key: ""            # Anthropic API key
      model: "claude-3-5-sonnet-4-20250514"
      base_url: "https://api.anthropic.com/v1"

# Image hosting (PicList)
piclist:
  url: "https://your-piclist-server:1443/upload"
  key: "your_piclist_key"
